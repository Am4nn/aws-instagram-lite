# Local AWS (Floci). Same as `floci start`, plus the flags this project needs.
# Container is named "floci" so `floci status/logs/reset` keep working.
services:
  floci:
    image: floci/floci:2.4.0
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      # Keep resources across restarts / laptop reboots (default is in-memory).
      FLOCI_STORAGE_MODE: "persistent"
      # Let API Gateway JWT authorizers trust the local Cognito issuer.
      FLOCI_SECURITY_ALLOW_PRIVATE_JWT_TARGETS: "true"
      # The flag only trusts *literal* loopback IPs, so Cognito must issue
      # tokens as http://127.0.0.1:4566/<pool> (not http://localhost:...).
      FLOCI_BASE_URL: "http://127.0.0.1:4566"
      # Let the Next.js dev server call Floci directly (Cognito sign-in from the browser).
      # WEB_ORIGIN (the local CloudFront URL) and WEB_ORIGIN_SHORT (same, as *.localhost, no DNS
      # needed in Chrome/Edge) are written to .env by `npm run deploy:web`.
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:3000,${WEB_ORIGIN:-http://localhost:3000},${WEB_ORIGIN_SHORT:-http://localhost:3000}"
      # Label the Lambda/ECR containers Floci starts with this compose project, so Docker Desktop
      # groups them under "instagram-lite" next to the floci container.
      FLOCI_DOCKER_EXTRA_LABELS_0__KEY: "com.docker.compose.project"
      FLOCI_DOCKER_EXTRA_LABELS_0__VALUE: "instagram-lite"
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_HEADERS: "x-amz-target,x-amz-user-agent,amz-sdk-invocation-id,amz-sdk-request"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Lambda runs in sibling containers
      - floci-data:/app/data
volumes:
  floci-data:
